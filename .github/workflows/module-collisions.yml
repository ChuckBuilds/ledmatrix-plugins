name: Plugin Structure

# Structural checks that scan ALL plugins, because each problem can arrive with
# a newly added plugin rather than a changed one. None needs the core checkout;
# guards that do run in test-plugins.yml.
#
# 1. Module collisions — fails when a plugin's deferred import (subpackage file
#    or function-scoped import) targets a sibling top-level module or package
#    whose name is also shipped by another plugin. The core loads plugin modules
#    by bare name on sys.path and isolates them after the entry point loads, so
#    such a deferred import can bind a different plugin's same-named module and
#    fail to load. An unparseable plugin file also fails.
#
# 2. Scroll adoption — fails when a plugin's scroll_display.py also defines the
#    fallback implementation it is supposed to import from
#    scroll_display_legacy.py. Three plugins shipped as those two files
#    concatenated, carrying ~2,000 lines nothing referenced, and that dead copy
#    is what hid the missing separator-icon constants that broke scroll mode.
#
# 3. Sports display() contract and scroll-mode reachability -- a display() that
#    returns None, or a scroll setting whose renderer nothing calls.
#
# 4. Pixel-perfect text -- fails when a Draw() that renders text leaves PIL's
#    fontmode at the anti-aliasing default. An LED panel has no partial
#    brightness, so the grey fringe just smears the glyph.
#
# 5. Repo docs/config consistency -- the root README's preview column matches
#    docs/assets, and config_secrets.template.json lists every x-secret field.

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/check_module_collisions.py'
      - 'scripts/check_scroll_adoption.py'
      - 'scripts/test_check_scroll_adoption.py'
      - 'scripts/check_sports_display_contract.py'
      - 'scripts/test_check_sports_display_contract.py'
      - 'scripts/test_pixel_perfect_text.py'
      - 'scripts/test_scroll_mode_is_reachable.py'
      - 'scripts/test_check_module_collisions.py'
      # README preview column vs docs/assets/<id>/hero.png on disk.
      - 'README.md'
      - 'docs/assets/**'
      - 'scripts/update_readme_previews.py'
      - 'config_secrets.template.json'
      - 'scripts/check_secrets_template.py'
      - 'scripts/test_check_secrets_template.py'
      # Without this, a PR that only edits this workflow matches no path and
      # the workflow never runs against its own change.
      - '.github/workflows/module-collisions.yml'
  workflow_dispatch:

jobs:
  collisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for cross-plugin module collisions
        run: python scripts/check_module_collisions.py
      # Its own regression suite: the gate reports by absence, and it used to
      # read an unparseable file as "no imports", i.e. clean.
      - name: Test the module-collision gate
        if: always()
        run: python scripts/test_check_module_collisions.py
      # Runs even when the collision check fails, so one PR surfaces both.
      - name: Check scroll adoption does not inline the fallback
        if: always()
        run: python scripts/check_scroll_adoption.py
      # The gate's own regression suite. It reports by absence -- "no legacy
      # classes found" and "could not look" would otherwise be the same
      # answer -- so a gate that quietly stopped detecting still exits 0.
      - name: Test the scroll-adoption gate
        if: always()
        run: python scripts/test_check_scroll_adoption.py
      # A sports display() that returns None reports content it does not have,
      # so an out-of-season mode is never skipped and holds a blank panel for
      # its whole duration. Source-level, so unlike the safety harness it needs
      # no data -- and the harness seeds games, so it never renders the empty
      # path this protects.
      - name: Check sports display() returns a bool on every path
        if: always()
        run: python scripts/check_sports_display_contract.py
      - name: Test the sports display()-contract gate
        if: always()
        run: python scripts/test_check_sports_display_contract.py
      # A scoreboard offering *_display_mode: "scroll" must actually reach its
      # scroll renderer. football's dispatch sat in a method nothing called, so
      # the setting silently kept switching cards -- and both existing tests
      # exercised the card renderer directly, never the path that reaches it.
      - name: Check scroll mode is reachable from display()
        if: always()
        run: python scripts/test_scroll_mode_is_reachable.py
      # PIL anti-aliases TrueType text by default, which on a panel with no
      # partial brightness only smears glyphs -- 4x6-font.ttf at 6 puts 74% of
      # its lit pixels at partial coverage. Static, because the plugins most at
      # risk render only with live data the harness has none of, so a
      # render-based check would skip exactly those.
      - name: Check text draws are 1-bit (no anti-aliasing)
        if: always()
        run: python scripts/test_pixel_perfect_text.py
      # The root README's Preview column is generated from which
      # docs/assets/<id>/hero.png files exist. Nothing ran --check, so ten rows
      # sat blank for weeks after their images landed.
      # (render_docs_assets.py --check is not run here: it re-renders every
      # shot list through the core renderer; see docs 07 for why.)
      - name: Check README plugin previews are current
        if: always()
        run: python scripts/update_readme_previews.py --check
      # Every x-secret schema field needs a placeholder in the root
      # config_secrets.template.json, namespaced by plugin id the way the core
      # stores it, so the template stays a complete list of what to fill in.
      - name: Check the secrets template covers every x-secret field
        if: always()
        run: python scripts/check_secrets_template.py
