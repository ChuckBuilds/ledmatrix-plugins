name: Update Plugin Registry

on:
  workflow_dispatch:  # Allow manual triggering from GitHub UI
  schedule:
    # Third-party plugins release from their own repos, which push nothing
    # here, so their versions are picked up on a timer.
    - cron: '17 6 * * *'
  push:
    branches:
      - main
    paths:
      - 'plugins/*/manifest.json'
      - 'update_registry.py'

concurrency:
  group: update-registry
  cancel-in-progress: false

jobs:
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Update plugin registry
        # --external also raises third-party entries' latest_version from the
        # manifest.json in their repos. An unreadable repo only warns.
        run: python update_registry.py --external

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet plugins.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add plugins.json
          git commit -m "Auto-update plugin registry with latest versions"
          # main may have moved while this ran (a merge, or the push-triggered run)
          git pull --rebase origin main
          git push

      - name: No changes
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "✓ Plugin registry is already up to date"
