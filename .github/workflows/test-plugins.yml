name: Plugin Safety

# Renders every changed plugin across a representative spread of matrix sizes and
# screens using the LEDMatrix core harness, and validates manifests. Gates PRs
# that touch plugin code so a change can't silently break a size or screen.

on:
  pull_request:
    paths:
      - 'plugins/**'
      # Repo-level guards live here and are run below. Without this a PR that
      # only touches one of them matches no path, the workflow never runs, and
      # the guard is merged without ever having executed.
      - 'scripts/**'
      - '.github/workflows/test-plugins.yml'
  workflow_dispatch:
    inputs:
      all:
        description: 'Check every plugin (not just changed ones)'
        type: boolean
        default: false

env:
  # The core repo provides the harness (scripts/check_plugin.py). Point these at
  # the fork/branch where the harness lives until it is merged upstream.
  CORE_REPO: ChuckBuilds/LEDMatrix
  CORE_REF: main

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: plugins-repo

      - name: Checkout core (harness)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install core + harness deps
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
          pip install RGBMatrixEmulator

      - name: Determine changed plugins (non-test code only)
        id: changed
        working-directory: plugins-repo
        env:
          ALL_INPUT: ${{ github.event.inputs.all }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$ALL_INPUT" = "true" ]; then
            ids=$(ls plugins)
            all_ids="$ids"
          else
            # Two lists, because the consumers want different things.
            #
            # ids -- plugins whose *shipped* code changed. Drives the version
            # bump gate and the safety harness. Test-only edits are excluded:
            # they change nothing a user receives, so demanding a version bump
            # for them is noise. The root-level test_*.py exclusion matters as
            # much as the test/ one -- most plugins keep their tests there, so
            # without it "test-only change" was never actually true.
            ids=$(git diff --name-only "$BASE_SHA"...HEAD -- 'plugins/*' \
              | grep -vE '^plugins/[^/]+/test/' \
              | grep -vE '^plugins/[^/]+/test_[^/]+\.py$' \
              | sed -E 's#^plugins/([^/]+)/.*#\1#' | sort -u)
            # all_ids -- any change at all, tests included. Drives the unit-test
            # run: a PR that only edits a test still has to prove the test
            # passes, which is exactly when it most needs checking.
            all_ids=$(git diff --name-only "$BASE_SHA"...HEAD -- 'plugins/*' \
              | sed -E 's#^plugins/([^/]+)/.*#\1#' | sort -u)
          fi
          echo "ids<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ids" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "all_ids<<EOF" >> "$GITHUB_OUTPUT"
          echo "$all_ids" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed plugins (shipped code):"; echo "$ids"
          echo "Changed plugins (including tests):"; echo "$all_ids"

      - name: Enforce version bump on changed plugins
        if: steps.changed.outputs.ids != '' && github.event.inputs.all != 'true'
        working-directory: plugins-repo
        env:
          # Read IDs from env (never interpolate ${{ }} into the script body) and
          # validate each one — plugin ids flow into python -c strings below, so a
          # crafted directory name on a PR branch could otherwise inject code.
          IDS: ${{ steps.changed.outputs.ids }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail=0
          for pid in $IDS; do
            case "$pid" in
              '' | *[!a-z0-9._-]*) echo "::error::invalid plugin id '$pid'"; fail=1; continue ;;
            esac
            cur=$(python -c "import json;print(json.load(open('plugins/$pid/manifest.json'))['version'])")
            old=$(git show "$BASE_SHA:plugins/$pid/manifest.json" 2>/dev/null \
              | python -c "import json,sys;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
            if [ -n "$old" ] && [ "$cur" = "$old" ]; then
              echo "::error::$pid code changed but version not bumped (still $cur). Users won't get the update."
              fail=1
            else
              echo "[ok] $pid version $old -> $cur"
            fi
          done
          exit $fail

      # The floor the store and loader actually read is versions[0]. Requiring
      # the new spelling only on plugins that are already being bumped lets the
      # migration finish organically, instead of rewriting 42 manifests and
      # pushing 42 store updates for a field rename with no behaviour change.
      - name: Check manifest version fields on changed plugins
        if: steps.changed.outputs.ids != '' && github.event.inputs.all != 'true'
        working-directory: plugins-repo
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: |
          for pid in $IDS; do
            case "$pid" in
              '' | *[!a-z0-9._-]*) echo "::error::invalid plugin id '$pid'"; exit 1 ;;
            esac
          done
          python scripts/check_manifest_version_fields.py $IDS
          # The gate's own regression suite -- its failure mode is silent,
          # so a manifest that looks migrated but resolves to no floor must
          # not slip through.
          python scripts/test_check_manifest_version_fields.py

      - name: Validate manifests against schema
        if: steps.changed.outputs.ids != ''
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          import jsonschema
          schema = json.load(open("core/schema/manifest_schema.json"))
          valid = re.compile(r"^[a-z0-9][a-z0-9._-]*$")
          ids = os.environ.get("IDS", "").split()
          failed = False
          for pid in ids:
              if not valid.match(pid):
                  print(f"[FAIL] invalid plugin id: {pid!r}"); failed = True; continue
              mpath = Path("plugins-repo/plugins") / pid / "manifest.json"
              if not mpath.exists():
                  print(f"[skip] {pid}: no manifest (deleted?)"); continue
              try:
                  jsonschema.validate(json.load(open(mpath)), schema)
                  print(f"[ok]   {pid}: manifest valid")
              except jsonschema.ValidationError as e:
                  print(f"[FAIL] {pid}: {e.message}"); failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Run safety harness on changed plugins
        if: steps.changed.outputs.ids != ''
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: |
          set -e
          fail=0
          failed_ids=""
          for pid in $IDS; do
            case "$pid" in
              '' | *[!a-z0-9._-]*) echo "::error::invalid plugin id (redacted)"; fail=1; failed_ids="$failed_ids (invalid-id)"; continue ;;
            esac
            pdir="plugins-repo/plugins/$pid"
            [ -d "$pdir" ] || { echo "::notice::$pid removed, skipping"; continue; }
            echo "::group::$pid"
            # Install the plugin's own runtime deps so it loads like a real install.
            # A failure here is a real problem (the plugin can't load), so let it fail.
            if [ -f "$pdir/requirements.txt" ]; then pip install -r "$pdir/requirements.txt"; fi
            python core/scripts/check_plugin.py --plugin "$pid" \
              --plugin-dir "$PWD/plugins-repo/plugins" || { fail=1; failed_ids="$failed_ids $pid"; }
            echo "::endgroup::"
          done
          # Summary at the very end so it survives log tail-truncation on long runs.
          if [ "$fail" -ne 0 ]; then
            echo "::error::Safety harness failed for:$failed_ids"
          else
            echo "Safety harness passed for all changed plugins."
          fi
          exit $fail

      # The plugins' own test_*.py. Nothing ran these until now: this workflow
      # was the harness plus manifest checks, so a plugin unit test guarded
      # nothing unless somebody ran it by hand. That is how a display() that
      # returned None on every path survived from February to August -- the
      # harness renders screens and cannot see a return value, and its fixtures
      # seed data so an empty-state path never executes.
      #
      # Runs with if: always() so a harness failure does not hide these, and
      # vice versa -- one PR should surface every problem it has.
      #
      # run_plugin_tests.py separates "prerequisites absent" (exit 2, reported
      # as a skip) from a real failure, which is what makes this gateable: a
      # script wanting a tty or an out-of-season feed no longer looks like a
      # regression. Adding a plugin test that cannot pass here will now fail
      # CI, so make it skip deliberately rather than leaving it red.
      # Repo-level guards: scripts/test_*.py, whatever is there.
      #
      # Discovered rather than listed. The structure workflow names its three
      # by hand, which is why five others -- including the schedule-window
      # plumbing guard -- had never run in CI at all: a guard added later is
      # simply not picked up, and nothing says so. Globbing means the next one
      # runs the day it lands.
      #
      # Here rather than in the structure workflow because several of these
      # import a plugin's modules, which pull in the core; this job is the one
      # that checks core out. They are written to skip cleanly when it is
      # absent, so running them without it would report success while checking
      # nothing.
      - name: Run repo-level guard tests
        if: always()
        working-directory: plugins-repo
        env:
          LEDMATRIX_CORE: ${{ github.workspace }}/core
          PYTHONPATH: ${{ github.workspace }}/core
        run: |
          set -u
          shopt -s nullglob
          guards=(scripts/test_*.py)
          if [ ${#guards[@]} -eq 0 ]; then
            echo "::error::no scripts/test_*.py found; the glob or the layout changed"
            exit 1
          fi
          failed=""
          for guard in "${guards[@]}"; do
            echo "::group::$guard"
            if python "$guard"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$guard::guard failed"
              failed="$failed $guard"
            fi
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

      - name: Run plugin unit tests on changed plugins
        if: always() && steps.changed.outputs.all_ids != ''
        working-directory: plugins-repo
        env:
          IDS: ${{ steps.changed.outputs.all_ids }}
        run: |
          set -e
          present=""
          for pid in $IDS; do
            case "$pid" in
              '' | *[!a-z0-9._-]*) echo "::error::invalid plugin id (redacted)"; exit 1 ;;
            esac
            # A plugin deleted in this PR is still a "changed" id; the runner
            # treats an unknown id as an error, so drop it here.
            [ -d "plugins/$pid" ] || { echo "::notice::$pid removed, skipping"; continue; }
            # The harness step installs these too, but this step runs even when
            # that one failed, so it cannot rely on having got that far.
            if [ -f "plugins/$pid/requirements.txt" ]; then
              pip install -r "plugins/$pid/requirements.txt"
            fi
            present="$present $pid"
          done
          if [ -z "$present" ]; then
            echo "No changed plugin still present; nothing to test."
            exit 0
          fi
          python scripts/run_plugin_tests.py $present --core "$GITHUB_WORKSPACE/core"

      - name: Nothing to check
        if: steps.changed.outputs.ids == ''
        run: echo "No shipped plugin code changed (test-only or docs change) — version gate and safety harness skipped; plugin unit tests still ran if any test changed."
